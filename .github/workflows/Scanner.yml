name: BIST Otomatik 15m/30m Taramasi

on:
  schedule:
    # Her saatin 03, 17, 33 ve 47. dakikalarında çalışır (UTC)
    - cron: '3,17,33,47 * * * *'
  workflow_dispatch: # GitHub panelinden manuel çalıştırabilmek için

jobs:
  tarama_job:
    runs-on: ubuntu-latest

    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v4

      - name: Python Ortamını Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Bağımlılıkları Yükle
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy requests openpyxl tqdm

      - name: Tarama Kodunu Çalıştır
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python tarama.py

      - name: Sinyal Durum Dosyasını Güncelle ve Commit Et
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add gonderilen_yeni_strateji_sinyalleri.json Yeni_Strateji_15m_30m_Sonuclari.xlsx || true
          git diff-index --quiet HEAD || git commit -m "chore: otomatik tarama durumu guncellendi [skip ci]"
          git push

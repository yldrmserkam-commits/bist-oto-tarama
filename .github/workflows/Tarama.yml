name: Crypto Signal Bot

on:
  schedule:
    # Her saatin 03, 17, 32 ve 47. dakikalarında çalışır
    - cron: '3,17,32,47 * * * *'
  workflow_dispatch:

permissions:
  contents: write # GitHub deposuna yazma ve güncelleme izni verir

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install yfinance pandas numpy requests tqdm openpyxl

      - name: Run bot script
        run: |
          python bot.py

      - name: Commit and push changes if new signals found
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add kripto_gonderilen_sinyaller.json || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update sent signals history [skip ci]" && git push)

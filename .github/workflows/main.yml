name: BIST 15m-30m Strateji Tarama

on:
  schedule:
    # Her saatin 03, 17, 32 ve 47. dakikalarında çalışır
    - cron: '3,17,32,47 * * * *'
  workflow_dispatch: # Manuel olarak da tetiklenebilir

jobs:
  tarama_calistir:
    runs-on: ubuntu-latest

    steps:
    - name: Repo'yu Kopyala
      uses: actions/checkout@v4

    - name: Python Kurulumu
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Bağımlılıkları ve Kütüphaneleri Yükle
      run: |
        python -m pip install --upgrade pip
        pip install yfinance pandas numpy requests openpyxl tqdm

    - name: Tarama Scriptini Çalıştır
      run: |
        python tarama.py

name: BIST Scanner Automation

on:
  schedule:
    # TSİ (UTC+3) her saatin 3, 18, 33 ve 48. dakikalarında çalışır
    - cron: '3,18,33,48 * * * *'
  workflow_dispatch: # Manuel tetikleme butonu

jobs:
  run-scanner:
    runs-on: ubuntu-latest

    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Gerekli Kütüphaneleri Yükle
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy requests openpyxl tqdm

      - name: Tarama Kodunu Çalıştır
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python tarama.py # Python dosyanın adı farklıysa burayı düzenle

      - name: Değişiklikleri Kaydet ve Push Et (JSON / Excel için)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Auto update scan results [skip ci]" || exit 0
          git push

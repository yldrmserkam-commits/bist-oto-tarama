ame: BIST Otomatik 15m/30m Taramasi

on:
  schedule:
    # Her saatin 11 ve 40. dakikalarında çalışır (UTC)
    - cron: '11,40 * * * *'
  workflow_dispatch: # GitHub panelinden manuel çalıştırabilmek için

jobs:
  BIST_Taramasi:
    name: BIST Taramasi
    runs-on: ubuntu-24.04

    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v5

      - name: Python Ortamını Kur
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Bağımlılıkları Yükle
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy requests openpyxl tqdm

      - name: Tarama Kodunu Çalıştır
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python tarama.py

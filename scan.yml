name: BIST Otomatik Sinyal Tarayici

on:
  schedule:
    # Her gün belirli saatlerde veya istediğiniz dakikalarda otomatik çalışır (Örn: Her saatin 11. ve 40. dakikası)
    - cron: '11,40 * * * *'
  workflow_dispatch: # GitHub arayüzünden el ile (manuel) çalıştırabilmek için

jobs:
  tarama_calistir:
    runs-on: ubuntu-latest
    
    # GitHub Actions'ın repoya dosya yazabilmesi (commit/push yapabilmesi) için yetki tanımı
    permissions:
      contents: write

    steps:
      - name: Depodaki Kodları Çek (Checkout)
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Sistem Seviyesi Paket Güncellemesi (Garanti Adım)
        run: |
          python -m pip install --upgrade pip

      - name: Python Tarama Scriptini Çalıştır
        run: python scanner.py

      - name: Değişen Dosyaları (Excel ve JSON) GitHub Reposuna Kaydet / Push Et
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "action@github.com"
          
          # Oluşan/değişen dosyaları ekle (Dosya yoksa hata vermemesi için || true eklendi)
          git add gonderilen_sinyaller.json RSI_Tarama_Sonuclari.xlsx || true
          
          # Eğer dosyalarda değişiklik olduysa commit yap ve gönder
          git commit -m "Otomatik tarama: Sinyal veritabanı ve Excel güncellendi [skip ci]" || true
          git push || true

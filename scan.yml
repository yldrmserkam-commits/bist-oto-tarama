name: BIST Alarm Botu

on:
  schedule:
    # Her saatin 17. dakikasında çalışır (Kuyruğa takılmayı önler)
    - cron: '17 * * * *'
  workflow_dispatch: # Manuel olarak da test edebilmen için

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Kodları Depodan Çek
        uses: actions/checkout@v4

      - name: Python Ortamını Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Gerekli Kütüphaneleri Yükle
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy requests

      - name: Botu Çalıştır
        run: python bot.py  # Python dosyanın adı neyse buraya onu yazabilirsin (örn: main.py)
